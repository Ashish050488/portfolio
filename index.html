    <script>
      (function(){
        var t = localStorage.getItem('theme');
        if (t === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
          if (!t) localStorage.setItem('theme', 'dark');
        }
      })();
    </script>
